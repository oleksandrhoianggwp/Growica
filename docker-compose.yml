services:
  app:
    build: .
    image: growica-report-submitter:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      HEADLESS: "true"
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    shm_size: "1gb"
    init: true
    restart: unless-stopped

volumes:
  app-data:
